# Deploys "Stage 4" (backend + frontend) to the DigitalOcean droplet on every
# push to main via a restricted SSH deploy key.
name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - "Stage 4/backend/**"
      - "Stage 4/frontend/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/flexsight/deploy.sh
